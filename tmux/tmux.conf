# When scrolling with mouse wheel, reduce number of scrolled rows per tick to "2" (default is 5)
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down


# ── Status Bar ────────────────────────────
set -g status on
set -g status-justify left
set -g status-position bottom
set -g status-left-length 30
set -g status-right-length 90

set -g @c_bg  "#111111"
set -g @c_red "#F80C0C"
set -g @c_yel "#CEA820"
set -g @c_wit "#EFFFFE"
set -g @c_cwi "#B4C1F0"
set -g @c_dbl "#2443B5"
set -g @c_blu "#4F6EE1"
set -g @c_dgr "#025A0E"
set -g @c_gre "#039016"

set -gF  @datetime "#[fg=#{E:@c_wit},bg=#{E:@c_blu}] %H:%M "
set -agF @datetime "#[fg=#{E:@c_cwi},bg=#{E:@c_dbl},italics] %a #[noitalics]%d-%b"

set -g @panetitle "#[fg=#{E:@c_dgr},bg=#{@c_bg},italics]  #{=/-25/…:#{s|$HOME|~|:#{pane_current_path}}}#[noitalics]"
# set -gF @weather   "#[fg=#FFFFFF,bg=#4F6EE1,italics] clima #{clima}#[noitalics]"

set -g @session_status "#[fg=#{?client_prefix,#{@c_yel},#{@c_wit}},bg=#{@c_red},bold]  #S "
set -g @window_zooned  "#{?window_zoomed_flag, , }"

set -g status-style "bg=#{@c_bg}"
# set -g status-style "#[bg=#000000]"
set -g status-left  "#{E:@session_status}"
set -g status-right "#{E:@panetitle} #{E:@datetime} "


# ── Window customization ────────────────────────────
set -g window-status-current-format "#[fg=#FFFFFF,bg=#1E1E2E] #{E:@window_zooned} #W "
set -g window-status-format "#[fg=gray,bg=#{@c_bg}] #I #W "
set -g window-status-separator ""
# set -g window-status-style "bg=#{@c_bg}"
# set -g window-status-separator "#[fg=#555555, bg=#000000]▎"


# ── Pane customization ────────────────────────────
set -g pane-border-style "fg=#464D4F,bg=default"
set -g pane-active-border-style "fg=#576062,bg=default"

set -g popup-border-style "fg=#576062,bg=default"
set -g popup-border-lines "rounded"

set -g message-style "fg=#{@c_red},bg=#{@c_yel},italics"
set -g message-command-style "fg=green,bg=#000000"

set -g pane-border-lines single
set -g pane-border-status off


# ── Remote TMUX customization ──────────────────────────
source-file "~/.dotfiles/tmux/tmux-remote.tmux"
# remote tmux enable/disable
bind -T root F12  \
       set prefix None \;\
       set key-table off \;\
       set status-right "" \;\
       if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
       set status off \;\
       refresh-client -S
bind -T off F12 \
       set -u prefix \;\
       set -u key-table \;\
       set status on \;\
       set -u status-right \;\
       refresh-client -S


# ── Custom Key Bindings ──────────────────────────
# Enter 'Resize Mode' with Prefix + O
bind o switch-client -T RESIZE \; \
 display-message "Resize mode: Use h/j/k/l to resize panes, Enter or Escape to exit"

# Map keys within that mode
bind -T RESIZE h resize-pane -L 6 \; switch-client -T RESIZE
bind -T RESIZE l resize-pane -R 6 \; switch-client -T RESIZE
bind -T RESIZE k resize-pane -U 2  \; switch-client -T RESIZE
bind -T RESIZE j resize-pane -D 2  \; switch-client -T RESIZE

# Press Enter or Escape to exit the mode
bind -T RESIZE Enter set-option -u key-table

# session switcher
bind "C-l" run-shell -b "~/.config/tmux/plugins/tmux-fzf/scripts/session.sh switch"

# Horizontal Split
bind h run-shell 'tmux split-window -h -t "#{@term_id}" -c "#{pane_current_path}"'
# Split Vertically, like a Terminal IDE
bind v split-window -v -l 8 -c "#{pane_current_path}" \; \
       select-pane -T term_pane -P "bg=#121119" \; \
       run-shell 'tmux set-option -g @term_id "#{pane_id}"'
# Toggle an AI tool Panel
bind a run-shell -b "~/.dotfiles/tmux/ai_pane.tmux"
# Toggle a Notes Panel
bind N run-shell -b "~/.dotfiles/tmux/notes.sh"
# Open a LazyGit Panel
bind -n C-g newp -y 90% -x 80% -Y 2 -X 10% -s "bg=#111111" -c "#{pane_current_path}" \
    "$HOME/.dotfiles/tmux/lazygit.sh"


# ── TPM Plugin Manager ───────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin '2kabhishek/tmux-tea'

run-shell ~/.config/tmux/plugins/tmux-yank/yank.tmux
run "~/.dotfiles/tmux/navigation.tmux"
# run "~/code/tmux-weather/tmux-weather.tmux"

# reload tmux.conf
bind r source-file "~/.config/tmux/tmux.conf" \;\
    display-message " Hey! tmux.conf sourced!"

# install tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "~/.config/tmux/plugins/tpm/tpm"

