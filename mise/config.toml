# Ferramentas por módulo em mise/tools/*.toml (ver links.toml)
[settings]
experimental = true

trusted_config_paths = [
  "~/workspace",
  "~/.dotfiles"
]

idiomatic_version_file_enable_tools = ["python"]

[settings.python]
uv_venv_auto = true

[tool_alias.java.versions]
8 = "corretto-8"
11 = "temurin-11"
17 = "temurin-17"
25 = "temurin-25"
lts = "temurin-25"
latest = "temurin-27"
